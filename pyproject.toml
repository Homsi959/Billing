[project]
name = "billing"
version = "0.1.0"
description = "Asynchronous payment processing and webhook delivery"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiohttp>=3.12,<4",
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "faststream[rabbit]>=0.7.7,<0.8",
    "pamqp>=3.3,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "uvicorn>=0.34,<1",
    "yarl>=1.17,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "poethepoet>=0.49.0",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
]

[tool.poe.tasks]
check = "bash scripts/check.sh"
demo = "bash scripts/demo.sh"
lint = "ruff check ."

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and RabbitMQ"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
